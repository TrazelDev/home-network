volumes:
  n8n_data:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "100.93.184.117:5678:5678"
    environment:
      - N8N_HOST=aether
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://100.93.184.117:5678/
      - GENERIC_TIMEZONE=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
